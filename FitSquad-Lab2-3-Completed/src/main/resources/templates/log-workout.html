<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${pageTitle}">Log Workout</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5" style="max-width: 800px">
  <h1 class="mb-4">Log Your Workout</h1>
  <form th:action="@{/log-workout}" th:object="${workoutLog}" method="post" novalidate class="card card-body shadow-sm">
    <div class="mb-3">
      <label for="athleteName" class="form-label">Athlete Name</label>
      <input id="athleteName" type="text" th:field="*{athleteName}" class="form-control" th:classappend="${#fields.hasErrors('athleteName')} ? 'is-invalid' : ''">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('athleteName')}" th:errors="*{athleteName}"></div>
    </div>
    <div class="mb-3">
      <label for="challengeId" class="form-label">Active Challenge</label>
      <select id="challengeId" th:field="*{challengeId}" class="form-select" th:classappend="${#fields.hasErrors('challengeId')} ? 'is-invalid' : ''">
        <option value="">-- Choose an Active Challenge --</option>
        <option th:each="c : ${challenges}" th:value="${c.id}" th:text="${c.title + ' (' + c.category + ')'}"></option>
      </select>
      <div class="invalid-feedback" th:if="${#fields.hasErrors('challengeId')}" th:errors="*{challengeId}"></div>
    </div>
    <div class="mb-3">
      <label for="workoutDate" class="form-label">Workout Date</label>
      <input id="workoutDate" type="date" th:field="*{workoutDate}" class="form-control" th:classappend="${#fields.hasErrors('workoutDate')} ? 'is-invalid' : ''">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('workoutDate')}" th:errors="*{workoutDate}"></div>
    </div>
    <div class="mb-3">
      <label for="durationMinutes" class="form-label">Duration (minutes)</label>
      <input id="durationMinutes" type="number" min="5" max="360" th:field="*{durationMinutes}" class="form-control" th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid' : ''">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}"></div>
    </div>
    <div class="mb-3">
      <label for="caloriesBurned" class="form-label">Calories Burned (kcal)</label>
      <input id="caloriesBurned" type="number" min="10" max="4000" th:field="*{caloriesBurned}" class="form-control" th:classappend="${#fields.hasErrors('caloriesBurned')} ? 'is-invalid' : ''">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('caloriesBurned')}" th:errors="*{caloriesBurned}"></div>
    </div>
    <div class="mb-3">
      <label for="intensityLevel" class="form-label">Intensity Level</label>
      <select id="intensityLevel" th:field="*{intensityLevel}" class="form-select" th:classappend="${#fields.hasErrors('intensityLevel')} ? 'is-invalid' : ''">
        <option value="">-- Select Intensity --</option>
        <option th:each="level : ${intensityLevels}" th:value="${level}" th:text="${level}"></option>
      </select>
      <div class="invalid-feedback" th:if="${#fields.hasErrors('intensityLevel')}" th:errors="*{intensityLevel}"></div>
    </div>
    <div class="mb-3">
      <label for="notes" class="form-label">Notes (optional, max 250 characters)</label>
      <textarea id="notes" rows="3" maxlength="250" th:field="*{notes}" class="form-control" th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''"></textarea>
      <div class="invalid-feedback" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
    </div>
    <div><button type="submit" class="btn btn-primary">Save Workout</button> <a th:href="@{/workout-logs}" class="btn btn-outline-secondary">View Logs</a></div>
  </form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
