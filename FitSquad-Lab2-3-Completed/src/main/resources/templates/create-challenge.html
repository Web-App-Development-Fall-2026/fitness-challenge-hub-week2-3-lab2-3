<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${pageTitle}">Create Challenge</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5" style="max-width: 760px">
  <h1 class="mb-4">Create a Challenge</h1>
  <form th:action="@{/create-challenge}" th:object="${challenge}" method="post" novalidate class="card card-body shadow-sm">
    <div class="mb-3">
      <label for="title" class="form-label">Challenge Title</label>
      <input id="title" th:field="*{title}" class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
    </div>
    <div class="mb-3">
      <label for="category" class="form-label">Category</label>
      <select id="category" th:field="*{category}" class="form-select" th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''">
        <option value="">-- Choose a category --</option>
        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
      </select>
      <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
    </div>
    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea id="description" th:field="*{description}" rows="3" class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"></textarea>
      <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
    </div>
    <div class="mb-3">
      <label for="durationDays" class="form-label">Duration (days)</label>
      <input id="durationDays" type="number" th:field="*{durationDays}" min="1" max="365" class="form-control" th:classappend="${#fields.hasErrors('durationDays')} ? 'is-invalid' : ''">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('durationDays')}" th:errors="*{durationDays}"></div>
    </div>
    <div><button class="btn btn-primary" type="submit">Save Challenge</button> <a th:href="@{/challenges}" class="btn btn-secondary">Cancel</a></div>
  </form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
