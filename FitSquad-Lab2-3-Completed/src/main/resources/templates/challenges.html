<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${pageTitle}">Challenges</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div><h1>Active Challenges</h1><p class="text-secondary">Choose a challenge and record your progress.</p></div>
    <a class="btn btn-primary" th:href="@{/create-challenge}">Create Challenge</a>
  </div>
  <div class="row g-3">
    <div class="col-md-4" th:each="challenge : ${challenges}">
      <div class="card h-100 shadow-sm"><div class="card-body">
        <span class="badge text-bg-primary mb-2" th:text="${challenge.category}">Category</span>
        <h5 class="card-title" th:text="${challenge.title}">Challenge title</h5>
        <p class="card-text" th:text="${challenge.description}">Description</p>
        <p class="small text-secondary" th:text="${challenge.durationDays + ' days'}">Duration</p>
        <a class="btn btn-outline-primary" th:href="@{/log-workout}">Log Workout</a>
      </div></div>
    </div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
