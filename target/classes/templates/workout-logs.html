<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pageTitle}">FitSquad Hub</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container"><h1>Workout Logs</h1><div th:if="${#lists.isEmpty(workoutLogs)}" class="empty"><h2>No Workouts Logged Yet</h2><p>Be the first squad member to complete a quest!</p><a th:href="@{/log-workout}">Log First Workout</a></div><div class="table-wrap" th:unless="${#lists.isEmpty(workoutLogs)}"><table><thead><tr><th>Athlete</th><th>Challenge</th><th>Date</th><th>Duration (min)</th><th>Calories</th><th>Intensity</th><th>Notes</th></tr></thead><tbody><tr th:each="log : ${workoutLogs}"><td th:text="${log.athleteName}"></td><td th:text="${log.challengeTitle}"></td><td th:text="${log.workoutDate}"></td><td th:text="${log.durationMinutes}"></td><td th:text="${log.caloriesBurned}"></td><td><span class="badge" th:classappend="${'level-' + log.intensityLevel.toLowerCase()}" th:text="${log.intensityLevel}"></span></td><td th:text="${log.notes}"></td></tr></tbody></table></div><p><a th:href="@{/log-workout}">+ Log another workout</a></p></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
