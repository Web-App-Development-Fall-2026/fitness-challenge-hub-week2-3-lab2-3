<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pageTitle}">FitSquad Hub</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container"><h1>Log a Workout</h1><p>Track your fitness progress.</p><form th:action="@{/log-workout}" th:object="${workoutLog}" method="post" novalidate>
<label>Athlete Name<input th:field="*{athleteName}" th:classappend="${#fields.hasErrors('athleteName')} ? 'is-invalid' : ''"></label><div class="error" th:errors="*{athleteName}"></div>
<label>Active Challenge<select th:field="*{challengeId}" th:classappend="${#fields.hasErrors('challengeId')} ? 'is-invalid' : ''"><option value="">-- Choose an Active Challenge --</option><option th:each="c : ${challenges}" th:value="${c.id}" th:text="${c.title} + ' (' + ${c.category} + ')'">Challenge</option></select></label><div class="error" th:errors="*{challengeId}"></div>
<label>Duration (minutes)<input type="number" th:field="*{durationMinutes}" th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid' : ''"></label><div class="error" th:errors="*{durationMinutes}"></div>
<label>Calories Burned<input type="number" th:field="*{caloriesBurned}" th:classappend="${#fields.hasErrors('caloriesBurned')} ? 'is-invalid' : ''"></label><div class="error" th:errors="*{caloriesBurned}"></div>
<label>Intensity<select th:field="*{intensityLevel}" th:classappend="${#fields.hasErrors('intensityLevel')} ? 'is-invalid' : ''"><option value="">-- Select Intensity --</option><option th:each="level : ${intensityLevels}" th:value="${level}" th:text="${level}"></option></select></label><div class="error" th:errors="*{intensityLevel}"></div>
<label>Workout Date<input type="date" th:field="*{workoutDate}" th:classappend="${#fields.hasErrors('workoutDate')} ? 'is-invalid' : ''"></label><div class="error" th:errors="*{workoutDate}"></div>
<label>Notes<textarea th:field="*{notes}" maxlength="250"></textarea></label><div class="error" th:errors="*{notes}"></div><button type="submit">Save Workout</button></form></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
