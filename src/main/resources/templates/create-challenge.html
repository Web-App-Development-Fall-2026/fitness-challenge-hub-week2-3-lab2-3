<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pageTitle}">FitSquad Hub</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container"><h1>Create a Challenge</h1><p class="error" th:if="${error}" th:text="${error}"></p><form th:action="@{/create-challenge}" th:object="${challenge}" method="post"><label>Title<input th:field="*{title}" required></label><label>Category<select th:field="*{category}"><option>Strength &amp; Core</option><option>Cardio &amp; HIIT</option><option>Flexibility</option></select></label><label>Description<textarea th:field="*{description}"></textarea></label><label>Target Goal<input th:field="*{targetGoal}"></label><label>Duration Days<input type="number" min="1" th:field="*{durationDays}"></label><label>Reward Points<input type="number" min="0" th:field="*{rewardPoints}"></label><label>Difficulty<select th:field="*{difficulty}"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label><button type="submit">Create Challenge</button></form></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
