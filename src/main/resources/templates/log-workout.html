
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${pageTitle}">Log Workout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-dark text-light">

    <!-- Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5">

        <h2 class="mb-2">Log Your Workout</h2>

        <p class="text-secondary mb-4">
            Record your workout and track your fitness progress.
        </p>

        <div class="card bg-dark text-light border-secondary">
            <div class="card-body p-4">

                <form th:action="@{/log-workout}"
                      th:object="${workoutLog}"
                      method="post"
                      novalidate>

                    <!-- Athlete Name -->
                    <div class="mb-3">
                        <label for="athleteName" class="form-label">
                            Athlete Name
                        </label>

                        <input type="text"
                               id="athleteName"
                               th:field="*{athleteName}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('athleteName')} ? 'is-invalid' : ''"
                               placeholder="Enter your name">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('athleteName')}"
                             th:errors="*{athleteName}"></div>
                    </div>

                    <!-- Select Challenge -->
                    <div class="mb-3">
                        <label for="challengeId" class="form-label">
                            Select Challenge
                        </label>

                        <select id="challengeId"
                                th:field="*{challengeId}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('challengeId')} ? 'is-invalid' : ''">

                            <option value="">
                                -- Choose an Active Challenge --
                            </option>

                            <option th:each="c : ${challenges}"
                                    th:value="${c.id}"
                                    th:text="${c.title} + ' (' + ${c.category} + ')'">
                            </option>
                        </select>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('challengeId')}"
                             th:errors="*{challengeId}"></div>
                    </div>

                    <!-- Workout Date -->
                    <div class="mb-3">
                        <label for="workoutDate" class="form-label">
                            Workout Date
                        </label>

                        <input type="date"
                               id="workoutDate"
                               th:field="*{workoutDate}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('workoutDate')} ? 'is-invalid' : ''">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('workoutDate')}"
                             th:errors="*{workoutDate}"></div>
                    </div>

                    <!-- Duration -->
                    <div class="mb-3">
                        <label for="durationMinutes" class="form-label">
                            Duration (Minutes)
                        </label>

                        <input type="number"
                               id="durationMinutes"
                               th:field="*{durationMinutes}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid' : ''"
                               placeholder="Example: 30">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('durationMinutes')}"
                             th:errors="*{durationMinutes}"></div>
                    </div>

                    <!-- Calories Burned -->
                    <div class="mb-3">
                        <label for="caloriesBurned" class="form-label">
                            Calories Burned (kcal)
                        </label>

                        <input type="number"
                               id="caloriesBurned"
                               th:field="*{caloriesBurned}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('caloriesBurned')} ? 'is-invalid' : ''"
                               placeholder="Example: 250">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('caloriesBurned')}"
                             th:errors="*{caloriesBurned}"></div>
                    </div>

                    <!-- Intensity Level -->
                    <div class="mb-3">
                        <label for="intensityLevel" class="form-label">
                            Intensity Level
                        </label>

                        <select id="intensityLevel"
                                th:field="*{intensityLevel}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('intensityLevel')} ? 'is-invalid' : ''">

                            <option value="">
                                -- Select Intensity --
                            </option>

                            <option th:each="level : ${intensityLevels}"
                                    th:value="${level}"
                                    th:text="${level}">
                            </option>
                        </select>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('intensityLevel')}"
                             th:errors="*{intensityLevel}"></div>
                    </div>

                    <!-- Workout Notes -->
                    <div class="mb-4">
                        <label for="notes" class="form-label">
                            Workout Notes (Optional)
                        </label>

                        <textarea id="notes"
                                  th:field="*{notes}"
                                  class="form-control"
                                  th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''"
                                  rows="3"
                                  placeholder="How did your workout go?"></textarea>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('notes')}"
                             th:errors="*{notes}"></div>
                    </div>

                    <!-- Buttons -->
                    <button type="submit" class="btn btn-primary">
                        Save Workout
                    </button>

                    <a th:href="@{/workout-logs}"
                       class="btn btn-outline-light ms-2">
                        View Workout Logs
                    </a>

                </form>

            </div>
        </div>

    </div>

    <!-- Reusable Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
