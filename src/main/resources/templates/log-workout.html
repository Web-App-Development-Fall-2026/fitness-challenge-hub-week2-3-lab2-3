
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Log Workout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-5">

        <h1 class="text-center mb-3" th:text="${pageTitle}">
            Log Your Workout
        </h1>

        <p class="text-center text-secondary mb-4">
            Record your workout and track your progress!
        </p>

        <div class="card bg-dark text-light border-secondary mx-auto"
             style="max-width: 750px;">

            <div class="card-body p-4">

                <form th:action="@{/log-workout}"
                      th:object="${workoutLog}"
                      method="post"
                      novalidate>

                    <div class="mb-3">
                        <label for="athleteName" class="form-label">
                            Athlete Name
                        </label>

                        <input type="text"
                               class="form-control"
                               id="athleteName"
                               th:field="*{athleteName}"
                               th:classappend="${#fields.hasErrors('athleteName')} ? 'is-invalid' : ''"
                               placeholder="Enter your name">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('athleteName')}"
                             th:errors="*{athleteName}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="challengeId" class="form-label">
                            Active Challenge
                        </label>

                        <select id="challengeId"
                                class="form-select"
                                th:field="*{challengeId}"
                                th:classappend="${#fields.hasErrors('challengeId')} ? 'is-invalid' : ''">

                            <option value="">-- Choose an Active Challenge --</option>

                            <option th:each="c : ${challenges}"
                                    th:value="${c.id}"
                                    th:text="${c.title} + ' (' + ${c.category} + ')'">
                            </option>
                        </select>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('challengeId')}"
                             th:errors="*{challengeId}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="durationMinutes" class="form-label">
                            Duration (minutes)
                        </label>

                        <input type="number"
                               class="form-control"
                               id="durationMinutes"
                               th:field="*{durationMinutes}"
                               th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid' : ''"
                               placeholder="30">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('durationMinutes')}"
                             th:errors="*{durationMinutes}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="caloriesBurned" class="form-label">
                            Calories Burned
                        </label>

                        <input type="number"
                               class="form-control"
                               id="caloriesBurned"
                               th:field="*{caloriesBurned}"
                               th:classappend="${#fields.hasErrors('caloriesBurned')} ? 'is-invalid' : ''"
                               placeholder="250">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('caloriesBurned')}"
                             th:errors="*{caloriesBurned}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="intensityLevel" class="form-label">
                            Intensity Level
                        </label>

                        <select id="intensityLevel"
                                class="form-select"
                                th:field="*{intensityLevel}"
                                th:classappend="${#fields.hasErrors('intensityLevel')} ? 'is-invalid' : ''">

                            <option value="">-- Select Intensity --</option>

                            <option th:each="level : ${intensityLevels}"
                                    th:value="${level}"
                                    th:text="${level}">
                            </option>
                        </select>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('intensityLevel')}"
                             th:errors="*{intensityLevel}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="workoutDate" class="form-label">
                            Workout Date
                        </label>

                        <input type="date"
                               class="form-control"
                               id="workoutDate"
                               th:field="*{workoutDate}"
                               th:classappend="${#fields.hasErrors('workoutDate')} ? 'is-invalid' : ''">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('workoutDate')}"
                             th:errors="*{workoutDate}">
                        </div>
                    </div>


                    <div class="mb-4">
                        <label for="notes" class="form-label">
                            Notes (Optional)
                        </label>

                        <textarea class="form-control"
                                  id="notes"
                                  rows="3"
                                  th:field="*{notes}"
                                  th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''"
                                  placeholder="How was your workout?">
                        </textarea>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('notes')}"
                             th:errors="*{notes}">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Log Workout
                    </button>

                </form>
            </div>
        </div>
    </main>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
