<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">FitSquad Hub - Create New Challenge</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom Application CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container my-5"><div class="row justify-content-center"><div class="col-lg-8"><h1 class="text-white">Log a Workout</h1><p class="text-secondary">Record your progress toward an active challenge.</p><div class="form-card"><form th:action="@{/log-workout}" th:object="${workoutLog}" method="post" novalidate><div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" role="alert">Please correct the highlighted fields.</div><div class="mb-3"><label class="form-label text-light" for="athleteName">Athlete Name</label><input class="form-control form-control-dark" type="text" id="athleteName" th:field="*{athleteName}" th:classappend="${#fields.hasErrors('athleteName')} ? 'is-invalid' : ''" aria-describedby="athleteNameError" ><div id="athleteNameError" class="invalid-feedback" th:if="${#fields.hasErrors('athleteName')}" th:errors="*{athleteName}"></div></div><div class="mb-3"><label class="form-label text-light" for="challengeId">Active Challenge</label><select class="form-select form-select-dark" id="challengeId" th:field="*{challengeId}" th:classappend="${#fields.hasErrors('challengeId')} ? 'is-invalid' : ''" aria-describedby="challengeIdError"><option value="">-- Choose an Active Challenge --</option><option th:each="c : ${challenges}" th:value="${c.id}" th:text="${c.title + ' (' + c.category + ')'}"></option></select><div id="challengeIdError" class="invalid-feedback" th:if="${#fields.hasErrors('challengeId')}" th:errors="*{challengeId}"></div></div><div class="mb-3"><label class="form-label text-light" for="durationMinutes">Duration (minutes)</label><input class="form-control form-control-dark" type="number" id="durationMinutes" th:field="*{durationMinutes}" th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid' : ''" aria-describedby="durationMinutesError" min="5" max="360"><div id="durationMinutesError" class="invalid-feedback" th:if="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}"></div></div><div class="mb-3"><label class="form-label text-light" for="caloriesBurned">Calories Burned (kcal)</label><input class="form-control form-control-dark" type="number" id="caloriesBurned" th:field="*{caloriesBurned}" th:classappend="${#fields.hasErrors('caloriesBurned')} ? 'is-invalid' : ''" aria-describedby="caloriesBurnedError" min="10" max="4000"><div id="caloriesBurnedError" class="invalid-feedback" th:if="${#fields.hasErrors('caloriesBurned')}" th:errors="*{caloriesBurned}"></div></div><div class="mb-3"><label class="form-label text-light" for="intensityLevel">Intensity Level</label><select class="form-select form-select-dark" id="intensityLevel" th:field="*{intensityLevel}" th:classappend="${#fields.hasErrors('intensityLevel')} ? 'is-invalid' : ''" aria-describedby="intensityLevelError"><option value="">-- Choose Intensity --</option><option th:each="level : ${intensityLevels}" th:value="${level}" th:text="${level}"></option></select><div id="intensityLevelError" class="invalid-feedback" th:if="${#fields.hasErrors('intensityLevel')}" th:errors="*{intensityLevel}"></div></div><div class="mb-3"><label class="form-label text-light" for="workoutDate">Workout Date</label><input class="form-control form-control-dark" type="date" id="workoutDate" th:field="*{workoutDate}" th:classappend="${#fields.hasErrors('workoutDate')} ? 'is-invalid' : ''" aria-describedby="workoutDateError" ><div id="workoutDateError" class="invalid-feedback" th:if="${#fields.hasErrors('workoutDate')}" th:errors="*{workoutDate}"></div></div><div class="mb-3"><label class="form-label text-light" for="notes">Notes (optional, maximum 250 characters)</label><textarea class="form-control form-control-dark" id="notes" th:field="*{notes}" th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''" aria-describedby="notesError" rows="3" maxlength="250"></textarea><div id="notesError" class="invalid-feedback" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div></div><div class="d-flex gap-3"><button class="btn btn-join" type="submit">Save Workout</button><a class="btn btn-outline-secondary" th:href="@{/workout-logs}">View Logs</a></div></form></div></div></div></main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
