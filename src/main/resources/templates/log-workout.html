
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Log Workout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <h2 class="text-center mb-4">Log Your Workout</h2>

    <div class="card shadow-sm mx-auto" style="max-width: 700px;">
        <div class="card-body p-4">

            <form th:action="@{/log-workout}"
                  th:object="${workoutLog}"
                  method="post" novalidate>

                <div class="mb-3">
                    <label for="athleteName" class="form-label">Athlete Name</label>
                    <input type="text" id="athleteName"
                           th:field="*{athleteName}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('athleteName')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('athleteName')}"
                         th:errors="*{athleteName}"></div>
                </div>

                <div class="mb-3">
                    <label for="challengeId" class="form-label">Active Challenge</label>
                    <select id="challengeId" th:field="*{challengeId}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('challengeId')} ? 'is-invalid' : ''">
                        <option value="">-- Choose an Active Challenge --</option>
                        <option th:each="c : ${challenges}"
                                th:value="${c.id}"
                                th:text="${c.title} + ' (' + ${c.category} + ')'">
                        </option>
                    </select>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('challengeId')}"
                         th:errors="*{challengeId}"></div>
                </div>

                <div class="mb-3">
                    <label for="workoutDate" class="form-label">Workout Date</label>
                    <input type="date" id="workoutDate"
                           th:field="*{workoutDate}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('workoutDate')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('workoutDate')}"
                         th:errors="*{workoutDate}"></div>
                </div>

                <div class="mb-3">
                    <label for="durationMinutes" class="form-label">Duration (Minutes)</label>
                    <input type="number" id="durationMinutes"
                           th:field="*{durationMinutes}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('durationMinutes')}"
                         th:errors="*{durationMinutes}"></div>
                </div>

                <div class="mb-3">
                    <label for="caloriesBurned" class="form-label">Calories Burned</label>
                    <input type="number" id="caloriesBurned"
                           th:field="*{caloriesBurned}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('caloriesBurned')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('caloriesBurned')}"
                         th:errors="*{caloriesBurned}"></div>
                </div>

                <div class="mb-3">
                    <label for="intensityLevel" class="form-label">Intensity Level</label>
                    <select id="intensityLevel"
                            th:field="*{intensityLevel}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('intensityLevel')} ? 'is-invalid' : ''">
                        <option value="">-- Select Intensity --</option>
                        <option th:each="level : ${intensityLevels}"
                                th:value="${level}"
                                th:text="${level}"></option>
                    </select>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('intensityLevel')}"
                         th:errors="*{intensityLevel}"></div>
                </div>

                <div class="mb-3">
                    <label for="notes" class="form-label">Workout Notes</label>
                    <textarea id="notes" th:field="*{notes}"
                              class="form-control" rows="3"
                              th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''"></textarea>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('notes')}"
                         th:errors="*{notes}"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Save Workout
                </button>

                <a th:href="@{/workout-logs}"
                   class="btn btn-outline-secondary w-100 mt-2">
                    View Workout Logs
                </a>

            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
