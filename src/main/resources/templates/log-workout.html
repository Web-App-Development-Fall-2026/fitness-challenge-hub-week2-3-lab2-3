
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log Workout - FitSquad Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <h2 class="mb-4">Log Your Workout</h2>

    <form th:action="@{/log-workout}"
          th:object="${workoutLog}"
          method="post"
          novalidate
          class="card p-4 shadow-sm">

        <!-- Athlete Name -->
        <div class="mb-3">
            <label class="form-label">Athlete Name</label>
            <input type="text"
                   th:field="*{athleteName}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('athleteName')} ? 'is-invalid' : ''">
            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('athleteName')}"
                 th:errors="*{athleteName}"></div>
        </div>

        <!-- Challenge Selection -->
        <div class="mb-3">
            <label class="form-label">Challenge</label>
            <select th:field="*{challengeId}"
                    class="form-select"
                    th:classappend="${#fields.hasErrors('challengeId')} ? 'is-invalid' : ''">
                <option value="">-- Choose an Active Challenge --</option>
                <option th:each="c : ${challenges}"
                        th:value="${c.id}"
                        th:text="${c.title} + ' (' + ${c.category} + ')'">
                </option>
            </select>
            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('challengeId')}"
                 th:errors="*{challengeId}"></div>
        </div>

        <!-- Duration -->
        <div class="mb-3">
            <label class="form-label">Duration (minutes)</label>
            <input type="number"
                   th:field="*{durationMinutes}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid' : ''">
            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('durationMinutes')}"
                 th:errors="*{durationMinutes}"></div>
        </div>

        <!-- Calories -->
        <div class="mb-3">
            <label class="form-label">Calories Burned</label>
            <input type="number"
                   th:field="*{caloriesBurned}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('caloriesBurned')} ? 'is-invalid' : ''">
            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('caloriesBurned')}"
                 th:errors="*{caloriesBurned}"></div>
        </div>

        <!-- Intensity -->
        <div class="mb-3">
            <label class="form-label">Intensity Level</label>
            <select th:field="*{intensityLevel}"
                    class="form-select"
                    th:classappend="${#fields.hasErrors('intensityLevel')} ? 'is-invalid' : ''">
                <option value="">-- Select Intensity --</option>
                <option th:each="level : ${intensityLevels}"
                        th:value="${level}"
                        th:text="${level}">
                </option>
            </select>
            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('intensityLevel')}"
                 th:errors="*{intensityLevel}"></div>
        </div>

        <!-- Workout Date -->
        <div class="mb-3">
            <label class="form-label">Workout Date</label>
            <input type="date"
                   th:field="*{workoutDate}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('workoutDate')} ? 'is-invalid' : ''">
            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('workoutDate')}"
                 th:errors="*{workoutDate}"></div>
        </div>

        <!-- Notes -->
        <div class="mb-3">
            <label class="form-label">Notes (Optional)</label>
            <textarea th:field="*{notes}"
                      class="form-control"
                      rows="3"
                      th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''"></textarea>
            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('notes')}"
                 th:errors="*{notes}"></div>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Workout
        </button>

    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
