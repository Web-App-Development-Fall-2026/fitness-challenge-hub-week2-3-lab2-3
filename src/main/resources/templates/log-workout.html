<!DOCTYPE html>
<html lang="en" xmlns="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Log a Workout'">Log Workout</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container mt-4 mb-5>
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-6">
                <div class="mb-4 text-center">
                    <h1 class="display-6 fw-bold text-primary">
                        <i class="bi bi-journal-plus me-2"></i><span th:text="${pageTitle}">Log a Workout</span>
                    </h1>
                    <p class="text-muted">Record your fitness quest completion</p>
                </div>

                <form th:action="@{/log-workout}" th:object="${workoutLog}" method="post" novalidate class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div class="mb-4">
                            <label for="athleteName" class="form-label fw-semibold">
                                <i class="bi bi-person me-1"></i>Athlete Name<span class="text-danger">*</span>
                            </label>
                            <input type="text" name="athleteName" id="athleteName" th:field="*{athleteName}" class="form-control" th:classappend="${#fields.hasErrors('athleteName')} ? 'is-invalid' : ''" placeholder="Enter name" autocomplete="off">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('athleteName')}" th:errors="*{athleteName}"></div>
                            <small class="form-text text-muted">2-40 characters required</small>
                        </div>

                        <div class="mb-4">
                            <label for="challengeId" class="form-label fw-semibold">
                                <i class="bi bi-trophy me-1"></i>Select Active Challenge <span class="text-danger">*</span>
                            </label>
                            <select name="challengeId" id="challengeId" th:field="*{challengeId}" class="form-select" th:classappend="${#fields.hasErrors('challengeId')} ? 'is-invalid' : ''">
                                <option value="">Choose an Active Challenge</option>
                                <option th:each="c : ${challenges}" th:value="${c.id}" th:text="${c.title} + ' (' + ${c.category} + ')'"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('challengeId')}" th:errors="*{challengeId}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="workoutDate" class="form-label fw-semibold">
                                <i class="bi bi-calendar-event me-1"></i>Workout Date<span class="text-danger">*</span>
                            </label>
                            <input type="date" id="workoutDate" th:field="*{workoutDate}" class="form-control" th:classappend="${#fields.hasErrors('workoutDate')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('workoutDate')}" th:errors="*{workoutDate}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="durationMinutes" class="form-label fw-semibold">
                                <i class="bi bi-clock me-1"></i>Duration (minutes)<span class="text-danger">*</span>
                            </label>
                            <input type="number" id="durationMinutes" th:field="*{durationMinutes}" class="form-control" min="5" max="360" th:classappend="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}">
                        </div>
                        <small class="form-text text-muted">Minimum 5 minutes, maximum 306 minutes</small>
                    </div>

                    <div class="mb-4">
                        <label for="caloriesBurned" class="form-label fw-semibold">
                            <i class="bi bi-fire me-1"></i>Calories Burned<span class="text-danger"></span>
                        </label>
                        <input type="number" id="caloriesBurned" th:field="*{caloriesBurned}" class="form-control" min="10" max="4000" th:classapppend="${#fields.hasErrors('caloriesBurned')} ? 'is-invalid' : ''" placeholder="10 - 4000">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('caloriesBurned')}" th:errors="*{caloriesBurned}"></div>
                        <small class="form-text text-muted">Minimum 10 kcal, maximum 4,000 kcal</small>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-graph-up-arrow me-1"></i>Intensity Level <span class="text-danger">*</span>
                        </label>
                        <div class="d-grid gap-2" th:if="${intensityLevels != null && !intensityLevels.isEmpty()}">
                            <div th:each="level : ${intensityLevels}" class="form-check">
                                <input class="form-check-input" type="radio" th:name="*{intensityLevel}" th:id="'intensity-' + ${#strings.toLowerCase(level)}" th:value="${level}" th:field="*{intensityLevel}">
                                <label class="form-check-label" th:for="'intensity-' + ${#strings.toLowerCase(level)}" th:text="${level}"></label>
                            </div>
                        </div>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('intensityLevel')}">
                            <span th:errors="*{intensityLevel}"></span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="notes" class="form-label fw-semibold">
                            <i class="bi bi-journal-text me-1"></i>Notes<span class="text-muted">(optional)</span>
                        </label>
                        <textarea id="notes" th:field="*{notes}" class="form-control" rows="3" maxlength="250" th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''" placeholder="Add any additional details about your workout..."></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
                        <small class="form-text text-muted float-end">Maximum 250 characters</small>
                        <div class="clearfix"></div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill">
                            <i class="bi bi-check-circle me-2"></i>Save Workout Log
                        </button>
                            <a th:href="@{/workout-logs}" class="btn btn-outline-secondary rounded-pill">
                                <i class="bi bi-arrow-left me-2"></i>View All Logs
                            </a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
