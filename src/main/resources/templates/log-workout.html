<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle}">Log Workout</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fb;
        }

        .form-container {
            max-width: 800px;
            margin: 40px auto;
        }

        .form-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .form-title {
            color: #0d6efd;
            font-weight: bold;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-submit {
            border-radius: 25px;
            padding: 12px 30px;
        }
    </style>
</head>

<body>

<!-- Navigation Bar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container form-container">

    <div class="card form-card">

        <div class="card-body p-4">

            <h2 class="text-center form-title mb-3">
                <i class="bi bi-activity"></i>
                Log Your Workout
            </h2>

            <p class="text-center text-muted mb-4">
                Record your workout and track your fitness progress.
            </p>

            <!-- Workout Form -->
            <form th:action="@{/log-workout}"
                  th:object="${workoutLog}"
                  method="post"
                  novalidate>

                <!-- Athlete Name -->
                <div class="mb-3">

                    <label for="athleteName" class="form-label">
                        Athlete Name
                    </label>

                    <input type="text"
                           id="athleteName"
                           th:field="*{athleteName}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('athleteName')} ? 'is-invalid' : ''"
                           placeholder="Enter athlete name">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('athleteName')}"
                         th:errors="*{athleteName}">
                    </div>

                </div>

                <!-- Select Challenge -->
                <div class="mb-3">

                    <label for="challengeId" class="form-label">
                        Select Active Challenge
                    </label>

                    <select id="challengeId"
                            th:field="*{challengeId}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('challengeId')} ? 'is-invalid' : ''">

                        <option value="">
                            -- Choose an Active Challenge --
                        </option>

                        <option th:each="c : ${challenges}"
                                th:value="${c.id}"
                                th:text="${c.title} + ' (' + ${c.category} + ')'">
                        </option>

                    </select>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('challengeId')}"
                         th:errors="*{challengeId}">
                    </div>

                </div>

                <!-- Workout Duration -->
                <div class="mb-3">

                    <label for="durationMinutes" class="form-label">
                        Workout Duration (Minutes)
                    </label>

                    <input type="number"
                           id="durationMinutes"
                           th:field="*{durationMinutes}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid' : ''"
                           placeholder="Enter duration in minutes">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('durationMinutes')}"
                         th:errors="*{durationMinutes}">
                    </div>

                </div>

                <!-- Calories Burned -->
                <div class="mb-3">

                    <label for="caloriesBurned" class="form-label">
                        Calories Burned (kcal)
                    </label>

                    <input type="number"
                           id="caloriesBurned"
                           th:field="*{caloriesBurned}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('caloriesBurned')} ? 'is-invalid' : ''"
                           placeholder="Enter calories burned">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('caloriesBurned')}"
                         th:errors="*{caloriesBurned}">
                    </div>

                </div>

                <!-- Intensity Level -->
                <div class="mb-3">

                    <label for="intensityLevel" class="form-label">
                        Intensity Level
                    </label>

                    <select id="intensityLevel"
                            th:field="*{intensityLevel}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('intensityLevel')} ? 'is-invalid' : ''">

                        <option value="">
                            -- Select Intensity --
                        </option>

                        <option th:each="level : ${intensityLevels}"
                                th:value="${level}"
                                th:text="${level}">
                        </option>

                    </select>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('intensityLevel')}"
                         th:errors="*{intensityLevel}">
                    </div>

                </div>

                <!-- Workout Date -->
                <div class="mb-3">

                    <label for="workoutDate" class="form-label">
                        Workout Date
                    </label>

                    <input type="date"
                           id="workoutDate"
                           th:field="*{workoutDate}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('workoutDate')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('workoutDate')}"
                         th:errors="*{workoutDate}">
                    </div>

                </div>

                <!-- Workout Notes -->
                <div class="mb-4">

                    <label for="notes" class="form-label">
                        Workout Notes (Optional)
                    </label>

                    <textarea id="notes"
                              th:field="*{notes}"
                              class="form-control"
                              th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''"
                              rows="4"
                              placeholder="Enter workout notes"></textarea>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('notes')}"
                         th:errors="*{notes}">
                    </div>

                </div>

                <!-- Buttons -->
                <div class="text-center">

                    <button type="submit"
                            class="btn btn-primary btn-submit">

                        <i class="bi bi-check-circle"></i>
                        Save Workout

                    </button>

                    <a th:href="@{/workout-logs}"
                       class="btn btn-outline-secondary btn-submit ms-2">

                        View Workout Logs

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- Footer Fragment -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
