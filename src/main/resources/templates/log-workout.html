<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">FitSquad Hub - Log Workout</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">

                <div class="text-center mb-4">
                    <h1 class="display-6 fw-bold text-white tracking-tight" th:text="${pageTitle}">Log a Workout</h1>
                    <p class="text-secondary small">Record your session, pick a challenge, and earn your XP.</p>
                </div>

                <div class="form-card">

                    <div class="alert alert-danger bg-danger bg-opacity-10 border border-danger border-opacity-25 text-danger d-flex align-items-center gap-2 mb-4 rounded-3"
                         th:if="${#fields.hasErrors('${workoutLog.*}')}">
                        <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                        <div>
                            <strong>Form has validation errors.</strong> Please correct the highlighted fields below.
                        </div>
                    </div>

                    <form th:action="@{/log-workout}" th:object="${workoutLog}" method="post" novalidate>

                        <!-- Athlete Name -->
                        <div class="mb-3">
                            <label for="athleteName" class="form-label text-white fw-semibold small">
                                Athlete Name <span class="text-danger">*</span>
                            </label>
                            <input type="text" id="athleteName" class="form-control form-control-dark"
                                   th:field="*{athleteName}"
                                   th:classappend="${#fields.hasErrors('athleteName')} ? 'is-invalid' : ''"
                                   placeholder="e.g., Jakob">
                            <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('athleteName')}">
                                <i class="bi bi-exclamation-circle-fill"></i>
                                <span th:errors="*{athleteName}">Error</span>
                            </div>
                        </div>

                        <!-- Challenge -->
                        <div class="mb-3">
                            <label for="challengeId" class="form-label text-white fw-semibold small">
                                Challenge <span class="text-danger">*</span>
                            </label>
                            <select id="challengeId" class="form-select form-control-dark"
                                    th:field="*{challengeId}"
                                    th:classappend="${#fields.hasErrors('challengeId')} ? 'is-invalid' : ''">
                                <option value="">-- Choose an Active Challenge --</option>
                                <option th:each="c : ${challenges}" th:value="${c.id}"
                                        th:text="${c.title} + ' (' + ${c.category} + ')'"></option>
                            </select>
                            <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('challengeId')}">
                                <i class="bi bi-exclamation-circle-fill"></i>
                                <span th:errors="*{challengeId}">Error</span>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Duration -->
                            <div class="col-md-6 mb-3">
                                <label for="durationMinutes" class="form-label text-white fw-semibold small">
                                    Duration (minutes) <span class="text-danger">*</span>
                                </label>
                                <input type="number" id="durationMinutes" class="form-control form-control-dark"
                                       th:field="*{durationMinutes}"
                                       th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid' : ''"
                                       placeholder="e.g., 45">
                                <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('durationMinutes')}">
                                    <i class="bi bi-exclamation-circle-fill"></i>
                                    <span th:errors="*{durationMinutes}">Error</span>
                                </div>
                            </div>

                            <!-- Calories -->
                            <div class="col-md-6 mb-3">
                                <label for="caloriesBurned" class="form-label text-white fw-semibold small">
                                    Calories Burned (kcal) <span class="text-danger">*</span>
                                </label>
                                <input type="number" id="caloriesBurned" class="form-control form-control-dark"
                                       th:field="*{caloriesBurned}"
                                       th:classappend="${#fields.hasErrors('caloriesBurned')} ? 'is-invalid' : ''"
                                       placeholder="e.g., 350">
                                <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('caloriesBurned')}">
                                    <i class="bi bi-exclamation-circle-fill"></i>
                                    <span th:errors="*{caloriesBurned}">Error</span>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Intensity -->
                            <div class="col-md-6 mb-3">
                                <label for="intensityLevel" class="form-label text-white fw-semibold small">
                                    Intensity Level <span class="text-danger">*</span>
                                </label>
                                <select id="intensityLevel" class="form-select form-control-dark"
                                        th:field="*{intensityLevel}"
                                        th:classappend="${#fields.hasErrors('intensityLevel')} ? 'is-invalid' : ''">
                                    <option value="">-- Select Intensity --</option>
                                    <option th:each="level : ${intensityLevels}" th:value="${level}" th:text="${level}"></option>
                                </select>
                                <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('intensityLevel')}">
                                    <i class="bi bi-exclamation-circle-fill"></i>
                                    <span th:errors="*{intensityLevel}">Error</span>
                                </div>
                            </div>

                            <!-- Workout Date -->
                            <div class="col-md-6 mb-3">
                                <label for="workoutDate" class="form-label text-white fw-semibold small">
                                    Workout Date <span class="text-danger">*</span>
                                </label>
                                <input type="date" id="workoutDate" class="form-control form-control-dark"
                                       th:field="*{workoutDate}"
                                       th:classappend="${#fields.hasErrors('workoutDate')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('workoutDate')}">
                                    <i class="bi bi-exclamation-circle-fill"></i>
                                    <span th:errors="*{workoutDate}">Error</span>
                                </div>
                            </div>
                        </div>

                        <!-- Notes -->
                        <div class="mb-4">
                            <label for="notes" class="form-label text-white fw-semibold small">Notes (optional)</label>
                            <textarea id="notes" rows="3" class="form-control form-control-dark"
                                      th:field="*{notes}"
                                      th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''"
                                      placeholder="How did it go?"></textarea>
                            <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('notes')}">
                                <i class="bi bi-exclamation-circle-fill"></i>
                                <span th:errors="*{notes}">Error</span>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-join rounded-pill px-4">
                            <i class="bi bi-fire me-1"></i> Log Workout
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </main>
	
	<div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>


</html>
