<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">FitSquad Hub - Create New Challenge</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom Application CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container my-5">
<div class="row justify-content-center"><div class="col-lg-8 col-xl-7">
<h1 class="text-white mb-4">Log a Workout</h1>
<div class="alert alert-info" th:if="${#lists.isEmpty(challenges)}">No active challenges are available. <a th:href="@{/create-challenge}">Create a challenge</a> first.</div>
<form class="form-card" th:action="@{/log-workout}" th:object="${workoutLog}" method="post" novalidate>
<div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">Please correct the highlighted fields.</div>
<div class="mb-3"><label for="athleteName" class="form-label text-white">Athlete Name</label>
<input type="text" id="athleteName" th:field="*{athleteName}" class="form-control form-control-dark" th:classappend="${#fields.hasErrors('athleteName')} ? 'is-invalid' : ''" minlength="2" maxlength="40" required>
<div class="invalid-feedback" th:if="${#fields.hasErrors('athleteName')}" th:errors="*{athleteName}"></div></div>
<div class="mb-3"><label for="challengeId" class="form-label text-white">Active Challenge</label>
<select id="challengeId" th:field="*{challengeId}" class="form-select form-control-dark" th:classappend="${#fields.hasErrors('challengeId')} ? 'is-invalid' : ''"><option value="">-- Choose an Active Challenge --</option><option th:each="c : ${challenges}" th:value="${c.id}" th:text="${c.title + ' (' + c.category + ')'}"></option></select>
<div class="invalid-feedback" th:if="${#fields.hasErrors('challengeId')}" th:errors="*{challengeId}"></div></div>
<div class="mb-3"><label for="durationMinutes" class="form-label text-white">Duration (minutes)</label>
<input type="number" id="durationMinutes" th:field="*{durationMinutes}" class="form-control form-control-dark" th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid' : ''" min="5" max="360" required>
<div class="invalid-feedback" th:if="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}"></div></div>
<div class="mb-3"><label for="caloriesBurned" class="form-label text-white">Calories Burned (kcal)</label>
<input type="number" id="caloriesBurned" th:field="*{caloriesBurned}" class="form-control form-control-dark" th:classappend="${#fields.hasErrors('caloriesBurned')} ? 'is-invalid' : ''" min="10" max="4000" required>
<div class="invalid-feedback" th:if="${#fields.hasErrors('caloriesBurned')}" th:errors="*{caloriesBurned}"></div></div>
<div class="mb-3"><label for="intensityLevel" class="form-label text-white">Intensity Level</label>
<select id="intensityLevel" th:field="*{intensityLevel}" class="form-select form-control-dark" th:classappend="${#fields.hasErrors('intensityLevel')} ? 'is-invalid' : ''"><option value="">-- Choose Intensity --</option><option th:each="level : ${intensityLevels}" th:value="${level}" th:text="${level}"></option></select>
<div class="invalid-feedback" th:if="${#fields.hasErrors('intensityLevel')}" th:errors="*{intensityLevel}"></div></div>
<div class="mb-3"><label for="workoutDate" class="form-label text-white">Workout Date</label>
<input type="date" id="workoutDate" th:field="*{workoutDate}" class="form-control form-control-dark" th:classappend="${#fields.hasErrors('workoutDate')} ? 'is-invalid' : ''"  required>
<div class="invalid-feedback" th:if="${#fields.hasErrors('workoutDate')}" th:errors="*{workoutDate}"></div></div>
<div class="mb-3"><label for="notes" class="form-label text-white">Notes (optional)</label>
<textarea id="notes" th:field="*{notes}" class="form-control form-control-dark" th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''" maxlength="250" rows="3"></textarea>
<div class="invalid-feedback" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div></div>
<button type="submit" class="btn btn-join">Save Workout</button>
<a th:href="@{/workout-logs}" class="btn btn-outline-secondary ms-2">View Logs</a>
</form></div></div></main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
