
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log Workout - FitSquad Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">

            <h2 class="text-center mb-3">Log Your Workout</h2>
            <p class="text-center text-secondary mb-4">
                Track your fitness progress with FitSquad Hub!
            </p>

            <div class="card bg-dark text-light border-secondary">
                <div class="card-body p-4">

                    <form th:action="@{/log-workout}"
                          th:object="${workoutLog}"
                          method="post" novalidate>

                        <div class="mb-3">
                            <label class="form-label">Athlete Name</label>
                            <input type="text" class="form-control"
                                   th:field="*{athleteName}"
                                   th:classappend="${#fields.hasErrors('athleteName')} ? 'is-invalid' : ''"
                                   placeholder="Enter your name">
                            <div class="invalid-feedback"
                                 th:errors="*{athleteName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Challenge</label>
                            <select class="form-select"
                                    th:field="*{challengeId}"
                                    th:classappend="${#fields.hasErrors('challengeId')} ? 'is-invalid' : ''">
                                <option value="">-- Choose an Active Challenge --</option>
                                <option th:each="c : ${challenges}"
                                        th:value="${c.id}"
                                        th:text="${c.title} + ' (' + ${c.category} + ')'">
                                </option>
                            </select>
                            <div class="invalid-feedback"
                                 th:errors="*{challengeId}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Workout Date</label>
                            <input type="date" class="form-control"
                                   th:field="*{workoutDate}"
                                   th:classappend="${#fields.hasErrors('workoutDate')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback"
                                 th:errors="*{workoutDate}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Duration (Minutes)</label>
                            <input type="number" class="form-control"
                                   th:field="*{durationMinutes}"
                                   th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid' : ''"
                                   placeholder="5 to 360 minutes">
                            <div class="invalid-feedback"
                                 th:errors="*{durationMinutes}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Calories Burned</label>
                            <input type="number" class="form-control"
                                   th:field="*{caloriesBurned}"
                                   th:classappend="${#fields.hasErrors('caloriesBurned')} ? 'is-invalid' : ''"
                                   placeholder="10 to 4000 kcal">
                            <div class="invalid-feedback"
                                 th:errors="*{caloriesBurned}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Intensity Level</label>
                            <select class="form-select"
                                    th:field="*{intensityLevel}"
                                    th:classappend="${#fields.hasErrors('intensityLevel')} ? 'is-invalid' : ''">
                                <option value="">-- Select Intensity --</option>
                                <option th:each="level : ${intensityLevels}"
                                        th:value="${level}"
                                        th:text="${level}">
                                </option>
                            </select>
                            <div class="invalid-feedback"
                                 th:errors="*{intensityLevel}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Notes (Optional)</label>
                            <textarea class="form-control" rows="3"
                                      th:field="*{notes}"
                                      th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''"
                                      placeholder="Add workout notes"></textarea>
                            <div class="invalid-feedback"
                                 th:errors="*{notes}"></div>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Save Workout
                        </button>

                    </form>

                </div>
            </div>

            <div class="text-center mt-4">
                <a th:href="@{/workout-logs}" class="btn btn-outline-light">
                    View Workout Logs
                </a>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
