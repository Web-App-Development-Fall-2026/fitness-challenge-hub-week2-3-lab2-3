<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Log Workout</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container">
        <section class="hero-section">
            <h1 class="display-6 fw-extrabold text-white tracking-tight mb-3" th:text="${pageTitle}">
                Log Your Workout
            </h1>
            <p class="text-secondary mb-4">Record your session, earn XP, and keep your squad streak alive</p>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="challenge-card p-4">

                        <form th:action="@{/log-workout}" th:object="${workoutLog}" method="post" novalidate>

                            <div class="mb-3">
                                <label for="athleteName" class="form-label text-light">Athlete Name</label>
                                <input type="text" id="athleteName" th:field="*{athleteName}" class="form-control"
                                       th:classappend="${#fields.hasErrors('athleteName')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('athleteName')}" th:errors="*{athleteName}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="challengeId" class="form-label text-light">Challenge</label>
                                <select id="challengeId" th:field="*{challengeId}" class="form-select"
                                        th:classappend="${#fields.hasErrors('challengeId')} ? 'is-invalid' : ''">
                                    <option value="">-- Choose an Active Challenge --</option>
                                    <option th:each="c : ${challenges}" th:value="${c.id}"
                                            th:text="${c.title} + ' (' + ${c.category} + ')'"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('challengeId')}" th:errors="*{challengeId}"></div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="durationMinutes" class="form-label text-light">Duration (minutes)</label>
                                    <input type="number" id="durationMinutes" th:field="*{durationMinutes}" class="form-control"
                                           th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}"></div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="caloriesBurned" class="form-label text-light">Calories Burned</label>
                                    <input type="number" id="caloriesBurned" th:field="*{caloriesBurned}" class="form-control"
                                           th:classappend="${#fields.hasErrors('caloriesBurned')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('caloriesBurned')}" th:errors="*{caloriesBurned}"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-light d-block">Intensity Level</label>
                                <div class="d-flex gap-3 flex-wrap">
                                    <div class="form-check" th:each="level : ${intensityLevels}">
                                        <input class="form-check-input" type="radio" th:field="*{intensityLevel}" th:value="${level}">
                                        <label class="form-check-label text-secondary" th:for="${#ids.prev('intensityLevel')}" th:text="${level}"></label>
                                    </div>
                                </div>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('intensityLevel')}" th:errors="*{intensityLevel}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="workoutDate" class="form-label text-light">Workout Date</label>
                                <input type="date" id="workoutDate" th:field="*{workoutDate}" class="form-control"
                                       th:classappend="${#fields.hasErrors('workoutDate')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('workoutDate')}" th:errors="*{workoutDate}"></div>
                            </div>

                            <div class="mb-4">
                                <label for="notes" class="form-label text-light">Notes</label>
                                <textarea id="notes" th:field="*{notes}" class="form-control" rows="3"
                                          th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''"></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
                            </div>

                            <button type="submit" class="btn btn-join w-100 fw-semibold rounded-3 py-2">
                                <i class="bi bi-check-circle-fill me-1"></i> Log Workout
                            </button>

                        </form>

                    </div>
                </div>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
