<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Log Workout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-5" style="max-width: 700px;">
        <h1 class="h3 text-white mb-4">Log a Workout</h1>

        <form th:action="@{/log-workout}" th:object="${workoutLog}" method="post" novalidate>

            <div class="mb-3">
                <label for="athleteName" class="form-label text-white">Athlete Name</label>
                <input type="text" id="athleteName" th:field="*{athleteName}"
                       class="form-control form-control-dark"
                       th:classappend="${#fields.hasErrors('athleteName')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('athleteName')}" th:errors="*{athleteName}"></div>
            </div>

            <div class="mb-3">
                <label for="challengeId" class="form-label text-white">Challenge</label>
                <select id="challengeId" th:field="*{challengeId}"
                        class="form-select form-select-dark"
                        th:classappend="${#fields.hasErrors('challengeId')} ? 'is-invalid' : ''">
                    <option value="">-- Choose an Active Challenge --</option>
                    <option th:each="c : ${challenges}" th:value="${c.id}"
                            th:text="${c.title} + ' (' + ${c.category} + ')'"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('challengeId')}" th:errors="*{challengeId}"></div>
            </div>

            <div class="mb-3">
                <label for="durationMinutes" class="form-label text-white">Duration (minutes)</label>
                <input type="number" id="durationMinutes" th:field="*{durationMinutes}"
                       class="form-control form-control-dark"
                       th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}"></div>
            </div>

            <div class="mb-3">
                <label for="caloriesBurned" class="form-label text-white">Calories Burned (kcal)</label>
                <input type="number" id="caloriesBurned" th:field="*{caloriesBurned}"
                       class="form-control form-control-dark"
                       th:classappend="${#fields.hasErrors('caloriesBurned')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('caloriesBurned')}" th:errors="*{caloriesBurned}"></div>
            </div>

            <div class="mb-3">
                <label for="intensityLevel" class="form-label text-white">Intensity Level</label>
                <select id="intensityLevel" th:field="*{intensityLevel}"
                        class="form-select form-select-dark"
                        th:classappend="${#fields.hasErrors('intensityLevel')} ? 'is-invalid' : ''">
                    <option value="">-- Choose Intensity --</option>
                    <option th:each="level : ${intensityLevels}" th:value="${level}" th:text="${level}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('intensityLevel')}" th:errors="*{intensityLevel}"></div>
            </div>

            <div class="mb-3">
                <label for="workoutDate" class="form-label text-white">Workout Date</label>
                <input type="date" id="workoutDate" th:field="*{workoutDate}"
                       class="form-control form-control-dark"
                       th:classappend="${#fields.hasErrors('workoutDate')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('workoutDate')}" th:errors="*{workoutDate}"></div>
            </div>

            <div class="mb-4">
                <label for="notes" class="form-label text-white">Notes (optional)</label>
                <textarea id="notes" rows="3" th:field="*{notes}"
                          class="form-control form-control-dark"
                          th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''"></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
            </div>

            <button type="submit" class="btn btn-join rounded-pill px-4">Save Workout</button>
            <a th:href="@{/workout-logs}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
        </form>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
