<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">FitSquad Hub - Log Workout</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom Application CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

    <!-- Navigation Header Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Container -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9">

                <!-- Page Header -->
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center gap-2 px-3 py-1 rounded-pill bg-dark border border-secondary-subtle text-secondary small mb-2">
                        <span class="badge bg-primary rounded-pill">MVC Week 2</span>
                        <span>Workout Logger</span>
                    </div>
                    <h1 class="h3 fw-bold text-white" th:text="${pageTitle}">Log Workout</h1>
                    <p class="text-secondary small">Record your progress and sync achievements to your active quests.</p>
                </div>

                <!-- Form Card -->
                <div class="card border-secondary border-opacity-25 bg-dark text-light shadow-lg rounded-4 p-4 p-md-5">
                    <form th:action="@{/log-workout}" th:object="${workoutLog}" method="post" novalidate>

                        <!-- Athlete Name -->
                        <div class="mb-3">
                            <label for="athleteName" class="form-label text-secondary small fw-semibold">Athlete Name</label>
                            <input type="text" id="athleteName" th:field="*{athleteName}" class="form-control bg-black text-light border-secondary" th:classappend="${#fields.hasErrors('athleteName')} ? 'is-invalid' : ''" placeholder="Enter your name">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('athleteName')}" th:errors="*{athleteName}"></div>
                        </div>

                        <!-- Challenge Selection -->
                        <div class="mb-3">
                            <label for="challengeId" class="form-label text-secondary small fw-semibold">Active Challenge</label>
                            <select id="challengeId" th:field="*{challengeId}" class="form-select bg-black text-light border-secondary" th:classappend="${#fields.hasErrors('challengeId')} ? 'is-invalid' : ''">
                                <option value="">-- Choose an Active Challenge --</option>
                                <option th:each="c : ${challenges}" th:value="${c.id}" th:text="${c.title} + ' (' + ${c.category} + ')'"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('challengeId')}" th:errors="*{challengeId}"></div>
                        </div>

                        <!-- Workout Date -->
                        <div class="mb-3">
                            <label for="workoutDate" class="form-label text-secondary small fw-semibold">Workout Date</label>
                            <input type="date" id="workoutDate" th:field="*{workoutDate}" class="form-control bg-black text-light border-secondary" th:classappend="${#fields.hasErrors('workoutDate')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('workoutDate')}" th:errors="*{workoutDate}"></div>
                        </div>

                        <!-- Duration and Calories Row -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="durationMinutes" class="form-label text-secondary small fw-semibold">Duration (minutes)</label>
                                <input type="number" id="durationMinutes" th:field="*{durationMinutes}" class="form-control bg-black text-light border-secondary" th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid' : ''" placeholder="e.g. 30">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="caloriesBurned" class="form-label text-secondary small fw-semibold">Calories Burned (kcal)</label>
                                <input type="number" id="caloriesBurned" th:field="*{caloriesBurned}" class="form-control bg-black text-light border-secondary" th:classappend="${#fields.hasErrors('caloriesBurned')} ? 'is-invalid' : ''" placeholder="e.g. 250">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('caloriesBurned')}" th:errors="*{caloriesBurned}"></div>
                            </div>
                        </div>

                        <!-- Intensity Level -->
                        <div class="mb-3">
                            <label for="intensityLevel" class="form-label text-secondary small fw-semibold">Intensity Level</label>
                            <select id="intensityLevel" th:field="*{intensityLevel}" class="form-select bg-black text-light border-secondary" th:classappend="${#fields.hasErrors('intensityLevel')} ? 'is-invalid' : ''">
                                <option value="">-- Select Intensity --</option>
                                <option th:each="level : ${intensityLevels}" th:value="${level}" th:text="${level}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('intensityLevel')}" th:errors="*{intensityLevel}"></div>
                        </div>

                        <!-- Notes -->
                        <div class="mb-4">
                            <label for="notes" class="form-label text-secondary small fw-semibold">Notes (Optional)</label>
                            <textarea id="notes" th:field="*{notes}" class="form-control bg-black text-light border-secondary" th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid' : ''" rows="3" placeholder="Add any details about your workout..."></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
                        </div>

                        <!-- Action Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-join py-3 rounded-pill fw-semibold text-white">
                                <i class="bi bi-check-circle-fill me-1"></i> Submit Workout Log
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
