
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Log Workout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="mb-4">
                <h1 class="fw-bold">Log Your Workout</h1>
                <p class="text-secondary">
                    Record your progress and complete your fitness challenge.
                </p>
            </div>

            <form th:action="@{/log-workout}"
                  th:object="${workoutLog}"
                  method="post"
                  novalidate
                  class="card bg-body-tertiary text-dark border-0 shadow p-4">

                <div class="mb-3">
                    <label for="athleteName" class="form-label">
                        Athlete Name
                    </label>
                    <input type="text"
                           id="athleteName"
                           th:field="*{athleteName}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('athleteName')} ? 'is-invalid' : ''"
                           placeholder="Enter your name">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('athleteName')}"
                         th:errors="*{athleteName}"></div>
                </div>

                <div class="mb-3">
                    <label for="challengeId" class="form-label">
                        Fitness Challenge
                    </label>
                    <select id="challengeId"
                            th:field="*{challengeId}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('challengeId')} ? 'is-invalid' : ''">
                        <option value="">-- Choose an Active Challenge --</option>
                        <option th:each="c : ${challenges}"
                                th:value="${c.id}"
                                th:text="${c.title + ' (' + c.category + ')'}">
                        </option>
                    </select>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('challengeId')}"
                         th:errors="*{challengeId}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="durationMinutes" class="form-label">
                            Duration (minutes)
                        </label>
                        <input type="number"
                               id="durationMinutes"
                               th:field="*{durationMinutes}"
                               class="form-control"
                               min="5" max="360"
                               th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('durationMinutes')}"
                             th:errors="*{durationMinutes}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="caloriesBurned" class="form-label">
                            Calories Burned (kcal)
                        </label>
                        <input type="number"
                               id="caloriesBurned"
                               th:field="*{caloriesBurned}"
                               class="form-control"
                               min="10" max="4000"
                               th:classappend="${#fields.hasErrors('caloriesBurned')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('caloriesBurned')}"
                             th:errors="*{caloriesBurned}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="intensityLevel" class="form-label">
                        Intensity Level
                    </label>
                    <select id="intensityLevel"
                            th:field="*{intensityLevel}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('intensityLevel')} ? 'is-invalid' : ''">
                        <option value="">-- Select Intensity --</option>
                        <option th:each="level : ${intensityLevels}"
                                th:value="${level}"
                                th:text="${level}">
                        </option>
                    </select>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('intensityLevel')}"
                         th:errors="*{intensityLevel}"></div>
                </div>

                <div class="mb-3">
                    <label for="workoutDate" class="form-label">
                        Workout Date
                    </label>
                    <input type="date"
                           id="workoutDate"
                           th:field="*{workoutDate}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('workoutDate')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('workoutDate')}"
                         th:errors="*{workoutDate}"></div>
                </div>

                <div class="mb-4">
                    <label for="notes" class="form-label">
                        Notes (Optional)
                    </label>
                    <textarea id="notes"
                              th:field="*{notes}"
                              class="form-control"
                              rows="3"
                              maxlength="250"
                              placeholder="Describe your workout..."></textarea>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('notes')}"
                         th:errors="*{notes}"></div>
                </div>

                <div class="d-flex flex-wrap gap-2">
                    <button type="submit"
                            class="btn btn-primary">
                        <i class="bi bi-check-circle me-1"></i>
                        Save Workout
                    </button>

                    <a th:href="@{/workout-logs}"
                       class="btn btn-outline-secondary">
                        View Workout Logs
                    </a>
                </div>

            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
