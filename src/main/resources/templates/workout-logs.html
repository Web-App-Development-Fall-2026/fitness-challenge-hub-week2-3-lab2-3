
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Workout Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-dark text-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Workout Dashboard</h1>
            <p class="text-secondary">Track your squad's achievements.</p>
        </div>
        <a th:href="@{/log-workout}" class="btn btn-primary">
            Log Workout
        </a>
    </div>

    <div th:if="${#lists.isEmpty(workoutLogs)}"
         class="alert alert-info text-center py-4">
        <i class="bi bi-info-circle fs-3 d-block mb-2"></i>
        <h5>No Workouts Logged Yet</h5>
        <p>Be the first squad member to complete a quest!</p>
        <a th:href="@{/log-workout}"
           class="btn btn-primary rounded-pill mt-2">
            Log First Workout
        </a>
    </div>

    <div th:unless="${#lists.isEmpty(workoutLogs)}"
         class="table-responsive">
        <table class="table table-dark table-striped table-hover align-middle">
            <thead>
                <tr>
                    <th>Athlete</th>
                    <th>Challenge</th>
                    <th>Date</th>
                    <th>Duration</th>
                    <th>Calories</th>
                    <th>Intensity</th>
                    <th>Notes</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="log : ${workoutLogs}">
                    <td th:text="${log.athleteName}"></td>
                    <td th:text="${log.challengeTitle}"></td>
                    <td th:text="${log.workoutDate}"></td>
                    <td th:text="${log.durationMinutes + ' min'}"></td>
                    <td th:text="${log.caloriesBurned + ' kcal'}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${log.intensityLevel == 'Low' ? 'bg-success' : (log.intensityLevel == 'Moderate' ? 'bg-info text-dark' : (log.intensityLevel == 'High' ? 'bg-warning text-dark' : 'bg-danger'))}"
                              th:text="${log.intensityLevel}"></span>
                    </td>
                    <td th:text="${log.notes != null and !log.notes.isBlank() ? log.notes : '—'}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
