
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Workout Logs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="fw-bold">Workout Logs</h1>
            <p class="text-secondary mb-0">
                Track your squad's fitness progress.
            </p>
        </div>

        <a th:href="@{/log-workout}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>
            Log Workout
        </a>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(workoutLogs)}"
         class="alert alert-info text-center py-4">

        <i class="bi bi-info-circle fs-3 d-block mb-2"></i>

        <h5>No Workouts Logged Yet</h5>

        <p>Be the first squad member to complete a quest!</p>

        <a th:href="@{/log-workout}"
           class="btn btn-primary rounded-pill mt-2">
            Log First Workout
        </a>
    </div>

    <!-- Workout table -->
    <div th:unless="${#lists.isEmpty(workoutLogs)}"
         class="table-responsive">

        <table class="table table-dark table-striped table-hover align-middle">
            <thead>
            <tr>
                <th>Athlete Name</th>
                <th>Challenge</th>
                <th>Workout Date</th>
                <th>Duration</th>
                <th>Calories</th>
                <th>Intensity</th>
                <th>Notes</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="log : ${workoutLogs}">
                <td th:text="${log.athleteName}">Alex</td>

                <td th:text="${log.challengeTitle}">
                    Fitness Challenge
                </td>

                <td th:text="${log.workoutDate}">2026-10-18</td>

                <td>
                    <span th:text="${log.durationMinutes}">30</span> min
                </td>

                <td>
                    <span th:text="${log.caloriesBurned}">250</span> kcal
                </td>

                <td>
                    <span class="badge"
                          th:classappend="${log.intensityLevel == 'Low'} ? 'text-bg-success' :
                                          (${log.intensityLevel == 'Moderate'} ? 'text-bg-info' :
                                          (${log.intensityLevel == 'High'} ? 'text-bg-warning' : 'text-bg-danger'))"
                          th:text="${log.intensityLevel}">
                        Moderate
                    </span>
                </td>

                <td>
                    <span th:text="${#strings.isEmpty(log.notes) ? '—' : log.notes}">
                        —
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
