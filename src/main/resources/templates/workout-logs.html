<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Workout Logs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Workout Logs</h1>
            <a th:href="@{/log-workout}" class="btn btn-primary">
                Log a Workout
            </a>
        </div>

        <div th:if="${#lists.isEmpty(workoutLogs)}"
             class="alert alert-info text-center py-4">
            <h5>No Workouts Logged Yet</h5>
            <p>Be the first squad member to complete a quest!</p>
            <a th:href="@{/log-workout}" class="btn btn-primary">
                Log First Workout
            </a>
        </div>

        <div th:unless="${#lists.isEmpty(workoutLogs)}"
             class="table-responsive">
            <table class="table table-dark table-striped align-middle">
                <thead>
                    <tr>
                        <th scope="col">Athlete Name</th>
                        <th scope="col">Challenge</th>
                        <th scope="col">Workout Date</th>
                        <th scope="col">Duration (minutes)</th>
                        <th scope="col">Calories (kcal)</th>
                        <th scope="col">Intensity</th>
                        <th scope="col">Notes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="log : ${workoutLogs}">
                        <td th:text="${log.athleteName}"></td>
                        <td th:text="${log.challengeTitle}"></td>
                        <td th:text="${log.workoutDate}"></td>
                        <td th:text="${log.durationMinutes}"></td>
                        <td th:text="${log.caloriesBurned}"></td>
                        <td>
                            <span th:switch="${log.intensityLevel}">
                                <span th:case="'Low'"
                                      class="badge text-bg-success">Low</span>
                                <span th:case="'Moderate'"
                                      class="badge text-bg-info">Moderate</span>
                                <span th:case="'High'"
                                      class="badge text-bg-warning">High</span>
                                <span th:case="'Extreme'"
                                      class="badge text-bg-danger">Extreme</span>
                                <span th:case="*"
                                      class="badge text-bg-secondary"
                                      th:text="${log.intensityLevel}"></span>
                            </span>
                        </td>
                        <td th:text="${log.notes}"
                            style="white-space: pre-wrap; overflow-wrap: anywhere;"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
<div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
