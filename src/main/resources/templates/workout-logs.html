<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">FitSquad Hub - Create New Challenge</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom Application CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container my-5">
<div class="d-flex justify-content-between align-items-center mb-4"><h1 class="text-white">Workout Logs</h1><a th:href="@{/log-workout}" class="btn btn-join">Log Workout</a></div>
<div th:if="${#lists.isEmpty(workoutLogs)}" class="alert alert-info text-center py-4">
<h2 class="h5">No Workouts Logged Yet</h2><p>Be the first squad member to complete a quest!</p>
<a th:href="@{/log-workout}" class="btn btn-primary rounded-pill mt-2">Log First Workout</a></div>
<div class="table-responsive" th:unless="${#lists.isEmpty(workoutLogs)}">
<table class="table table-dark table-striped align-middle">
<thead><tr><th scope="col">Athlete Name</th><th scope="col">Challenge Title</th><th scope="col">Workout Date</th><th scope="col">Duration (minutes)</th><th scope="col">Calories Burned</th><th scope="col">Intensity Level</th><th scope="col">Notes</th></tr></thead>
<tbody><tr th:each="log : ${workoutLogs}">
<td th:text="${log.athleteName}"></td><td th:text="${log.challengeTitle}"></td><td th:text="${log.workoutDate}"></td>
<td th:text="${log.durationMinutes}"></td><td th:text="${log.caloriesBurned}"></td>
<td><span class="badge" th:classappend="${log.intensityLevel == 'Low' ? 'bg-success' : (log.intensityLevel == 'Moderate' ? 'bg-primary' : (log.intensityLevel == 'High' ? 'bg-warning text-dark' : 'bg-danger'))}" th:text="${log.intensityLevel}"></span></td>
<td class="workout-notes" th:text="${#strings.isEmpty(log.notes) ? '—' : log.notes}"></td>
</tr></tbody></table></div></main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
