<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Workout Logs</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container">
        <section class="hero-section">
            <h1 class="display-6 fw-extrabold text-white tracking-tight mb-4" th:text="${pageTitle}">
                Workout Logs Dashboard
            </h1>

            <div th:if="${#lists.isEmpty(workoutLogs)}" class="alert alert-info text-center py-4">
                <i class="bi bi-info-circle fs-3 d-block mb-2"></i>
                <h5>No Workouts Logged Yet</h5>
                <p>Be the first squad member to complete a quest</p>
                <a th:href="@{/log-workout}" class="btn btn-primary rounded-pill mt-2">Log First Workout</a>
            </div>

            <div th:unless="${#lists.isEmpty(workoutLogs)}" class="table-responsive challenge-card p-3">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Athlete</th>
                            <th>Challenge</th>
                            <th>Date</th>
                            <th>Duration</th>
                            <th>Calories</th>
                            <th>Intensity</th>
                            <th>Notes</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${workoutLogs}">
                            <td th:text="${log.athleteName}">Name</td>
                            <td th:text="${log.challengeTitle}">Challenge</td>
                            <td th:text="${log.workoutDate}">Date</td>
                            <td th:text="${log.durationMinutes} + ' min'">30 min</td>
                            <td th:text="${log.caloriesBurned} + ' kcal'">200 kcal</td>
                            <td>
                                <span class="badge rounded-pill"
                                      th:classappend="${log.intensityLevel == 'Low'} ? 'diff-badge-beginner' :
                                                       (${log.intensityLevel == 'Moderate'} ? 'diff-badge-intermediate' : 'diff-badge-advanced')"
                                      th:text="${log.intensityLevel}">Moderate</span>
                            </td>
                            <td th:text="${log.notes}">Notes</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
