<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pageTitle}">FitSquad Hub</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container"><h1>Fitness Challenges</h1><p>Choose your next challenge.</p><a class="button" th:href="@{/create-challenge}">Create Challenge</a><section class="cards"><article th:each="c : ${challenges}" class="card"><h2 th:text="${c.title}"></h2><p th:text="${c.description}"></p><p><strong th:text="${c.category}"></strong> · <span th:text="${c.difficulty}"></span></p><p th:text="${c.durationDays} + ' days · ' + ${c.rewardPoints} + ' XP'"></p></article></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
